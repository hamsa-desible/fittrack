spring.application.name=fittrack
server.port=${PORT:8080}

# Local development: in-memory H2 database (no setup needed).
# In production the "prod" profile switches to PostgreSQL.
spring.datasource.url=jdbc:h2:mem:fittrack;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Cache stats with Caffeine (in-memory, bounded, 10 minute TTL)
spring.cache.cache-names=userStats
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m,recordStats

# API docs: /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

app.demo-data.enabled=true
