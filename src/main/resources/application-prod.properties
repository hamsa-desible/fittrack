# PostgreSQL connection comes from environment variables (set by the hosting platform)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Trust X-Forwarded-* headers from the hosting platform's proxy (for correct https links)
server.forward-headers-strategy=framework
